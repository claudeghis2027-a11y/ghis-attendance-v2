<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>GHIS Attendance</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0f2a4a;font-family:Tahoma,Arial,sans-serif;color:#1b1b1b;padding:16px;box-sizing:border-box}
    .card{background:#fff;border-radius:14px;padding:24px 20px;max-width:380px;width:100%;text-align:center;
          box-shadow:0 8px 30px rgba(0,0,0,.25)}
    h1{margin:0 0 8px;font-size:20px;color:#0f2a4a}
    p{margin:0 0 18px;font-size:14px;line-height:1.7;color:#444}
    a.btn{display:block;padding:14px 16px;border-radius:10px;background:#1f7a3a;color:#fff;
          text-decoration:none;font-size:16px;font-weight:bold}
    small{display:block;margin-top:14px;font-size:12px;color:#777;direction:ltr;word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <h1>نظام الحضور والانصراف</h1>
    <p>اضغط الزر لفتح نظام الحضور.</p>
    <a class="btn" id="openApp" href="https://claudeghis2027-a11y.github.io/ghis-attendance-v2/" target="_top" rel="noopener">فتح نظام الحضور</a>
    <small>https://claudeghis2027-a11y.github.io/ghis-attendance-v2/</small>
  </div>
  <script>
    // Attendance V2 entry page served by doGet() → HtmlService.createHtmlOutputFromFile('Index').
    // The attendance app itself (camera, GPS, face-api models) runs from GitHub Pages,
    // so this page only forwards the employee there. If the browser blocks automatic
    // top-level navigation from the Apps Script frame, the button above still works.
    (function () {
      var url = document.getElementById('openApp').href;
      try { window.top.location.replace(url); } catch (e) { /* button fallback */ }
    })();
  </script>
</body>
</html>
